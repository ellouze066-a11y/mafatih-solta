<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدّي حقوق الإنسان</title><style>body{font-family:Tahoma,Arial;background:#f4f7fb;color:#17253b;margin:0;padding:18px}.wrap{max-width:700px;margin:auto}header,.card{background:white;padding:22px;border-radius:16px;margin:12px 0;box-shadow:0 3px 14px #1b365012}h1{color:#123a62}button{display:block;width:100%;padding:14px;margin:10px 0;text-align:right;border:1px solid #b8cadb;border-radius:10px;background:#f8fbff;font-size:17px;cursor:pointer}button:hover{background:#dcecff}.correct{background:#d9f3df!important}.wrong{background:#ffe1e1!important}.small{color:#52657b}#next{background:#123a62;color:white;text-align:center}#progress{font-weight:bold;color:#245b84}</style><div class="wrap"><header><h1>⚖️ تحدّي حقوق الإنسان</h1><p>التربية المدنية – الثالثة آداب | دروس الأستاذ أنيس اللوز</p><p id="progress"></p></header><div class="card"><h2 id="q"></h2><div id="answers"></div><p id="explain" class="small"></p><button id="next" style="display:none" onclick="advance()">السؤال الموالي ←</button></div></div><script>const data=[["ما الأساس الأخلاقي لحقوق الإنسان؟",["الكرامة الإنسانية","ثروة الفرد","رضا الحاكم"],0,"الكرامة قيمة متأصلة ومتساوية بين البشر."],["ما الفرق بين الحاجة والحق؟",["لا فرق","الحاجة افتقار والحق استحقاق مشروع","كل رغبة حق"],1,"الحاجة منطلق للمطالبة، لكن الحق يتطلب أساسًا للمشروعية."],["من صاحب نظرية الحقوق الطبيعية: الحياة والحرية والملكية؟",["هوبز","جون لوك","مونتسكيو"],1,"يرى لوك أن الحقوق الطبيعية سابقة عن الدولة."],["ما الهدف الأساسي للدولة عند هوبز؟",["ضمان الأمن والسلم","إلغاء القانون","منع التعليم"],0,"الخوف من الصراع يدفع إلى إنشاء سلطة مشتركة."],["ما المقصود بالحرية المدنية عند روسو؟",["فعل كل ما نشاء","الخضوع لإرادة شخص واحد","العيش وفق قوانين يشارك المواطنون في وضعها"],2,"يربط روسو الحرية المدنية بالقانون والإرادة العامة."],["أيّ عبارة صحيحة؟",["الحقوق الطبيعية والحقوق المدنية مترادفتان دائمًا","الحقوق الطبيعية تصور فلسفي والمدنية حقوق ينظمها القانون","القانون يخلق كرامة الإنسان"],1,"يجب التمييز بين المصدر الفكري والضمان القانوني."],["متى اعتُمد الإعلان العالمي لحقوق الإنسان؟",["10 ديسمبر 1948","10 ديسمبر 1958","26 جوان 1945"],0,"اعتمدته الجمعية العامة للأمم المتحدة في باريس."],["في أي سنة اعتُمد العهدان الدوليان؟",["1789","1966","1989"],1,"دخل العهدان حيز النفاذ سنة 1976."],["ماذا تعني كونية حقوق الإنسان؟",["تخص مواطني دولة واحدة","تشمل جميع البشر دون تمييز","تخص البالغين فقط"],1,"تستند الكونية إلى المساواة في الكرامة."],["كيف نفهم ترابط الحقوق؟",["يمكن عزل التعليم عن بقية الحقوق","الحقوق الاقتصادية أهم دائمًا","التمتع بحق يساعد على ممارسة حقوق أخرى"],2,"التعليم مثلًا يدعم المشاركة وحرية التعبير."],["أي حق من الحقوق الاقتصادية والاجتماعية؟",["الحق في الصحة","الحق في الانتخاب","حرية الرأي"],0,"الصحة من الحقوق الاقتصادية والاجتماعية."],["ما التاريخ الذي يرتبط بإعلان حقوق الإنسان والمواطن في فرنسا؟",["1215","1789","1993"],1,"كان الإعلان محطة بارزة في تاريخ الحقوق."]];let i=0,score=0,locked=false;function show(){locked=false;document.getElementById('progress').textContent='السؤال '+(i+1)+' من '+data.length+' | النقاط '+score;document.getElementById('q').textContent=data[i][0];document.getElementById('explain').textContent='';document.getElementById('next').style.display='none';document.getElementById('answers').innerHTML='';data[i][1].forEach((v,j)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(locked)return;locked=true;if(j===data[i][2])score++;[...document.querySelectorAll('#answers button')].forEach((x,k)=>x.className=k===data[i][2]?'correct':k===j?'wrong':'');document.getElementById('explain').textContent=data[i][3];document.getElementById('next').style.display='block';document.getElementById('next').textContent=i===data.length-1?'عرض النتيجة':'السؤال الموالي ←'};document.getElementById('answers').appendChild(b)})}function advance(){i++;if(i<data.length){show();return}document.getElementById('progress').textContent='انتهى التحدي';document.getElementById('q').textContent='نتيجتك: '+score+' / '+data.length;document.getElementById('answers').innerHTML='<p>أحسنت! راجع الشروح المرتبطة بالإجابات لتحسين نتيجتك.</p>';document.getElementById('explain').textContent='';document.getElementById('next').textContent='إعادة المحاولة';document.getElementById('next').style.display='block';document.getElementById('next').onclick=()=>location.reload()}show();</script></html>

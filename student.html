<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>واجهة الفرق | خصائص السلطة السياسية حتى العصور الحديثة</title></head><body><header><div class="brand">بوابة الفرق التاريخية</div><a href="index.html">الرئيسية</a></header><main class="container"><div class="eyebrow">المعهد الثانوي 9 أفريل 1938 بصفاقس · التربية المدنية · السنة الثانية ثانوي · الأستاذ أنيس اللوز</div><h1>الدرس الثاني: خصائص السلطة السياسية حتى العصور الحديثة</h1><section id="join" class="panel"><h2>انضمّ إلى المنافسة</h2><label>رمز الحصة</label><input id="code" maxlength="6" placeholder="رمز الغرفة"><label>اسم الفريق</label><input id="name" placeholder="مثلًا: المؤرخون"><button id="enter">دخول الفريق</button><p id="error" class="notice hide"></p></section><div id="play" class="hide"><div class="panel"><div class="flex between"><h2 id="stage"></h2><span id="phase" class="status"></span></div><p class="muted" id="scene"></p><img id="archive" class="archive" alt="سند من الكتاب المدرسي"><p id="source" class="caption"></p><div class="flex"><button id="voice" class="alt">استمع إلى الشخصية</button><button id="showPage" class="alt">تكبير السند</button></div><p id="voiceNote" class="caption"></p></div><div id="challenge" class="panel"><h2>التحدّي التاريخي</h2><p id="question" class="big"></p><div id="options"></div><label>تبرير الفريق: استشهد بالسند</label><textarea id="reason" placeholder="نستدلّ من السند على أن..." maxlength="1200"></textarea><button id="send">إرسال الإجابة والتبرير إلى الأستاذ</button><p id="sent" class="muted"></p></div><section id="takeaway" class="panel hide"><h2>أدوّن في كراسي حصيلة نشاطي</h2><p id="summary" class="source"></p><p class="muted">انتظر إشارة الأستاذ للانتقال إلى العنصر التالي.</p></section><div class="panel"><strong id="team"></strong> <span class="score" id="score"></span></div></div></main><script type="module" src="student.js"></script></body></html>

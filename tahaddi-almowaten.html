<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدّي المواطن الفاعل</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172b4d;margin:0}.wrap{max-width:650px;margin:auto;padding:18px}header{background:#12365b;color:white;padding:23px;border-radius:16px;text-align:center}h1{margin:0 0 8px;font-size:26px}.card{background:white;padding:22px;border:1px solid #dbe3ed;border-radius:15px;margin-top:15px;box-shadow:0 4px 14px #17324d0a}.muted{color:#53677c}.choice{display:block;width:100%;text-align:right;padding:15px;border:2px solid #d9e3ee;background:white;border-radius:12px;margin:10px 0;font-size:17px;cursor:pointer}.choice:hover{border-color:#3277ba}.choice:disabled{cursor:default}.correct{border-color:#1e8753;background:#e9f8ef}.wrong{border-color:#c44949;background:#fff0f0}.btn{background:#1765a0;color:white;border:0;padding:13px 22px;border-radius:10px;font-size:17px;cursor:pointer}.btn:disabled{opacity:.45}.progress{height:9px;background:#dfe8f1;border-radius:12px;overflow:hidden;margin:16px 0}.bar{height:100%;background:#2483ba;transition:width .3s}.feedback{padding:12px;border-radius:10px;background:#f1f6fa;line-height:1.8;margin:12px 0}.hide{display:none}footer{text-align:center;color:#607085;padding:20px;font-size:13px}label{display:block;margin:12px 0}input{padding:12px;border:1px solid #cbd8e5;border-radius:8px;font-size:17px;width:100%}</style></head><body><div class="wrap"><header><h1>🏛️ تحدّي المواطن الفاعل</h1><div>الأولى ثانوي · التربية المدنية</div><div>المواطن مشارك في الخيارات والقرارات</div></header><section id="start" class="card"><h2>مستعدّ للتحدّي؟</h2><p>12 سؤالًا في 3 جولات: المفاهيم، المشاركة، والمواقف التطبيقية. بعد كل إجابة يظهر التفسير.</p><label>اسم التلميذ أو الفريق<input id="name" placeholder="اكتب اسمك أو اسم الفريق" maxlength="40"></label><button class="btn" id="begin">ابدأ التحدّي</button></section><section id="play" class="card hide"><div id="meta" class="muted"></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><button class="btn hide" id="next">السؤال التالي ←</button></section><section id="end" class="card hide"><h2 id="result"></h2><p id="detail"></p><div id="review"></div><button class="btn" id="again">إعادة اللعب</button></section><footer>مراجعة تعليمية · جذاذة المواطن مشارك في الخيارات والقرارات · الأستاذ أنيس اللوز</footer></div><script>const qs=[["ما المقصود بالخيارات العامة؟",["توجّهات كبرى تهم المجتمع","تعليمات فردية داخل القسم","عقوبة يفرضها مسؤول"],0,"الخيارات العامة هي التوجّهات الكبرى في مجالات مثل التعليم والصحة والتنمية."],["أيّ مثال يمثّل خيارًا عامًا؟",["تغيير مكان مقعد تلميذ","إصلاح المنظومة التربوية","تحديد موعد اجتماع قسم"],1,"إصلاح التعليم خيار عام لأنه يهم المجتمع ومستقبل المدرسة."],["ما المقصود بالقرار؟",["رأي غير ملزم دائمًا","إجراء أو اختيار محدّد تتخذه جهة مختصّة","كلّ نقاش بين مواطنين"],1,"القرار اختيار عملي محدّد تتخذه جهة أو مؤسسة في حدود صلاحياتها."],["ما الفرق بين الاستشارة والقرار؟",["الاستشارة تجمع الآراء والقرار يحسم اختيارًا","هما الشيء نفسه","الاستشارة تلغي المؤسسات"],0,"الاستشارة تساعد على بلورة الخيارات، ولا تعني وحدها أن المشاركين أصدروا القرار النهائي."],["الاستشارة الوطنية حول إصلاح التعليم مثال على:",["المساهمة في رسم الخيارات العامة","قرار فردي داخل جمعية","عقوبة إدارية"],0,"إبداء الرأي في إصلاح التعليم يساهم في بلورة توجّه عام."],["كيف يساهم المواطن في رسم الخيارات العامة؟",["بإبداء الرأي وتقديم المقترحات في الاستشارات","بالامتناع عن كل حوار","باتخاذ كل القرارات بمفرده"],0,"الاستشارة والحوار والمقترحات من وسائل المشاركة في الخيارات العامة."],["ماذا يبيّن بلاغ بلدي يدعو المواطنين إلى جلسة تشاركية؟",["إمكانية الاستماع إلى آرائهم في الشأن المحلي","أن كل حاضر أصبح رئيس البلدية","أن القرارات لا تحتاج إلى نقاش"],0,"الجلسة التشاركية تتيح عرض المقترحات ومناقشة مسائل محلية، مع احترام صلاحيات الجهات المختصة."],["أنت عضو في مجلس جمعية. كيف تساهم في اتخاذ قرار؟",["أناقش المقترحات وأصوّت وفق قواعد الجمعية","أفرض رأيي بالقوة","أغادر دون الاستماع"],0,"المساهمة المسؤولة تكون بالحوار والتداول والتصويت عند الاقتضاء."],["أيّ تصرّف يعبّر عن تحمّل المسؤولية داخل مؤسسة؟",["الاستماع إلى الآراء قبل اتخاذ القرار","إقصاء المخالفين","رفض تعليل القرارات"],0,"المسؤولية تستوجب الحوار والتعليل واحترام القواعد."],["مدير مؤسسة يناقش مع الأطراف المعنية تحسين نظافة الساحة. ما المرحلة الأولى المناسبة؟",["تشخيص المشكلة والاستماع إلى المقترحات","معاقبة الجميع فورًا","إلغاء كل الأنشطة"],0,"تشخيص المشكلة وجمع المقترحات يساعدان على اتخاذ قرار مناسب."],["ما فائدة مساهمة المواطن في الخيارات والقرارات؟",["ترسيخ المسؤولية وتحسين ملاءمة القرارات للحاجات","منع الاختلاف في الآراء","إلغاء المؤسسات"],0,"المشاركة تعزز الشعور بالمسؤولية وتجعل الخيارات أقرب إلى حاجات الناس."],["اقترح التلاميذ مكتبة صغيرة، وناقش مجلس المؤسسة الإمكانات ثم أقرّ تنفيذها. أين يظهر القرار؟",["في اقتراح الفكرة فقط","في إقرار تنفيذ المشروع من الجهة المختصة","في عرض المشكلة فقط"],1,"المقترح يفتح النقاش، أما القرار فيتمثل في اعتماد المشروع من الجهة المختصة."]];let i=0,score=0,answers=[],who="";const $=id=>document.getElementById(id);function show(id){["start","play","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}function render(){const q=qs[i];$("meta").textContent="الجولة "+(Math.floor(i/4)+1)+" من 3 · السؤال "+(i+1)+" من 12 · النقاط "+score;$("bar").style.width=((i+1)/qs.length*100)+"%";$("question").textContent=q[0];$("choices").innerHTML="";$("feedback").classList.add("hide");$("next").classList.add("hide");q[1].forEach((a,j)=>{let b=document.createElement("button");b.className="choice";b.textContent=a;b.onclick=()=>answer(j);$("choices").appendChild(b)})}function answer(j){let q=qs[i],ok=j===q[2];if(ok)score+=10;answers.push({q:q[0],ok,explain:q[3]});Array.from($("choices").children).forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add("correct");else if(k===j)b.classList.add("wrong")});$("feedback").textContent=(ok?"✓ إجابة صحيحة! ":"✕ إجابة غير صحيحة. ")+q[3];$("feedback").classList.remove("hide");$("next").textContent=i===qs.length-1?"عرض النتيجة":"السؤال التالي ←";$("next").classList.remove("hide")}function finish(){show("end");$("result").textContent="أحسنت يا "+who+"! نتيجتك "+score+" / 120";$("detail").textContent=score>=100?"ممتاز! فهمت الفرق بين الخيارات والقرارات.":score>=70?"جيد! راجع التفسيرات لتحسّن نتيجتك.":"واصل المراجعة، ثم أعد التحدّي.";let wrong=answers.filter(a=>!a.ok);$("review").innerHTML="";if(wrong.length){let h=document.createElement("h3");h.textContent="راجع هذه الأفكار:";$("review").appendChild(h);wrong.forEach(a=>{let p=document.createElement("p");p.textContent="• "+a.q+" — "+a.explain;$("review").appendChild(p)})}}$("begin").onclick=()=>{who=$("name").value.trim()||"المواطن الفاعل";i=0;score=0;answers=[];show("play");render()};$("next").onclick=()=>{i++;if(i===qs.length)finish();else render()};$("again").onclick=()=>{show("start")};</script></body></html>
